# Capability note: fields marked [NOT IMPLEMENTED] are configuration placeholders
# for later phases. They do not enable any working feature in this release.
# Run `offerbomber doctor` for the authoritative list.

app:
  name: OfferBomber
  mode: personal
  timezone: Asia/Shanghai
  dry_run: true

discovery:
  enabled: true
  auto_expand_companies: true
  interval_hours: 4
  sources:
    - greenhouse
    - lever
    - ashby
    - official_careers       # public careers pages / embedded JSON-LD
    - search_engine          # requires discovery.search_provider below
    - community_public       # requires user-configured public URLs
  # Optional public careers URLs the user explicitly configured. Empty means
  # no official-candidates pages are scanned. No URL is invented by the system.
  careers_urls: []
  # Optional official search API. base_url is FIXED here; never supplied by the
  # model. Set api_key_env to the NAME of an env var holding the key (not the key).
  # search_provider:
  #   base_url: "https://api.example.com/search"
  #   api_key_env: OFFERBOMBER_SEARCH_API_KEY
  #   result_limit: 20
  companies: []              # user/industry specific; no defaults hardcoded

matching:
  broad_search: true
  exclude_hard_mismatches: true
  # Preferences live in per-user JobSearchProfile campaigns, not here.
  # Leaving target_fields empty imposes NO occupational constraint.
  target_fields: []

profile:
  allow_pdf_import: true
  allow_manual_updates: true
  store_fact_provenance: true
  require_fact_verification: true

resume:
  # ResumePlan is implemented; Reactive Resume adapter is live-verified with a
  # real key. Set OFFERBOMBER_RXRESUME_API_KEY (and optionally
  # OFFERBOMBER_RXRESUME_URL) via env — never in this file. Without a key,
  # health_check reports unavailable and generation fails explicitly.
  provider: reactive_resume
  tailor_per_job: true
  preserve_original: true
  validate_pdf: true
  cache_base_versions: true

applications:
  # Preparation is implemented. Sending requires human approval + credentials.
  auto_prepare: true
  auto_send: false           # Auto stays OFF; per-user opt-in in JobSearchProfile
  max_emails_per_day: 20
  require_verified_recipient: true
  prevent_duplicates: true

email:
  # Provider is selectable. Gmail OAuth reads OFFERBOMBER_GMAIL_CREDENTIALS
  # (a path to a local credential file, never stored in the repo/DB).
  provider: gmail
  sync_minutes: 10
  auto_reply_low_risk: false

models:
  # mock | workbuddy | deepseek_harness | openai_compatible | auto
  # 'auto' prefers a configured real host adapter, else falls back to mock.
  # Credentials come from env vars, NEVER from this file:
  #   workbuddy: OFFERBOMBER_WORKBUDDY_TOKEN
  #   deepseek_harness: OFFERBOMBER_DSH_BIN (dsh on PATH)
  #   openai_compatible: OFFERBOMBER_MODEL_BASE_URL / _API_KEY / _NAME
  preferred: auto
  reuse_host_model: true
  standalone_api_optional: true
  timeout_seconds: 60
  max_attempts: 3
  # [NOT LIVE-VERIFIED] adapters use documented interfaces but need real credentials
  # for live validation; mock results are never reported as real model calls.

notifications:
  use_host_connectors: true  # optional; local file always records notifications
  urgent_enabled: true

reports:
  daily_enabled: true
  daily_time: "21:00"

storage:
  backend: sqlite
  backups_enabled: true
  db_path: .offerbomber/offerbomber.db
