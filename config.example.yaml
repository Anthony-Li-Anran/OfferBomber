app:
  name: OfferBomber
  mode: personal
  timezone: Asia/Shanghai
  dry_run: true

discovery:
  enabled: true
  auto_expand_companies: true
  interval_hours: 4
  sources:
    - greenhouse
    - lever
    - ashby
    - official_careers
    - search_engine
    - xiaohongshu_public
  companies:
    - platform: greenhouse
      token: stripe
      name: Stripe
    - platform: lever
      token: leverdemo
      name: Lever Demo
    - platform: ashby
      token: ashby
      name: Ashby

matching:
  broad_search: true
  exclude_hard_mismatches: true
  target_fields:
    - pretraining
    - posttraining
    - ai_infra
    - machine_learning
    - quantitative_research
    - quantitative_engineering

profile:
  allow_pdf_import: true
  allow_manual_updates: true
  store_fact_provenance: true
  require_fact_verification: true

resume:
  provider: reactive_resume
  tailor_per_job: true
  preserve_original: true
  validate_pdf: true
  cache_base_versions: true

applications:
  auto_prepare: true
  auto_send: false
  max_emails_per_day: 20
  require_verified_recipient: true
  prevent_duplicates: true

email:
  provider: gmail
  sync_minutes: 10
  auto_reply_low_risk: false

models:
  preferred: auto
  reuse_host_model: true
  standalone_api_optional: true

notifications:
  use_host_connectors: true
  urgent_enabled: true

reports:
  daily_enabled: true
  daily_time: "21:00"

storage:
  backend: sqlite
  backups_enabled: true
  db_path: .offerbomber/offerbomber.db
